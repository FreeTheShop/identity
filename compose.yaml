# Just this service's database, for `mvn spring-boot:run -Dspring-boot.run.profiles=dev,customer` (or dev,staff).
# To run the whole ecosystem locally, use ../../platform/local-dev/compose.yaml instead.
services:
  mongo:
    image: ${MONGO_IMAGE:-mongo:7.0}   # 8.x fails on kernels 6.19-7.0.13 (SERVER-121912); set MONGO_IMAGE=mongo:8.0 once fixed
    ports: ["27017:27017"]
    volumes: ["identity-mongo:/data/db"]
volumes:
  identity-mongo:
