# Dependency CVE scan (OWASP dependency-check). Manual for now: it needs the NVD_API_KEY secret.
# Sprint 2: add the secret (Actions and Dependabot), then move this back into ci.yml as a blocking gate.
name: owasp

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Cache NVD data
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      - name: Dependency CVE gate (fails on CVSS >= 7)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -Powasp -DskipTests verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
