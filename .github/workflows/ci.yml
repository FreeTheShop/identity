name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 from 19 Oct 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit, architecture, integration and BDD tests
        run: mvn -B verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            target/cucumber-report.html
            target/surefire-reports
            target/failsafe-reports
      - name: Build image
        run: docker build -t identity-service:${{ github.sha }} .
      - name: Scan image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: identity-service:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
