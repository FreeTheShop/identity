# Local development only. Never activate in a shared environment.
# The service clients' secrets (Staff Identity, application-staff.yml reads these). Environment variables win.
PRICE_SERVICE_CLIENT_SECRET: "{noop}dev-price-secret"
VALIDATION_SERVICE_CLIENT_SECRET: "{noop}dev-validation-secret"
server:
  servlet:
    session:
      cookie:
        secure: false
management:
  otlp:
    metrics:
      export:
        # Dev only: push metrics to the local Grafana stack (platform/local-dev/observability.yaml).
        enabled: ${OTLP_METRICS_ENABLED:true}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: 15s
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}   # set to 0 when no OTLP collector is running
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
identity:
  jwt:
    allow-ephemeral-keys: true
  security:
    allow-plaintext-client-secrets: true
  cors:
    allowed-origins: ${IDENTITY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  bootstrap-admin:              # used by the Staff Identity only
    email: ${IDENTITY_BOOTSTRAP_ADMIN_EMAIL:admin@oldnew.local}
    password: ${IDENTITY_BOOTSTRAP_ADMIN_PASSWORD:dev-only-admin-password}
logging:
  level:
    com.oldnew: DEBUG
